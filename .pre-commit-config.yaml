repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-ast           # Checks Python syntax
      - id: check-yaml          # Checks YAML syntax
      - id: check-json          # Checks JSON syntax
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer

  # Python: Black for formatting
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
        language_version: python3

  # Python: Flake8 for linting/syntax errors
  - repo: https://github.com/PyCQA/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--ignore=E203,W503,E402,F401,E501,F541,E722,F811,F841,F402"]

  # Frontend/Mobile: Prettier for formatting JS/TS/CSS/HTML
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|ts|jsx|tsx|css|scss|html|md)$
